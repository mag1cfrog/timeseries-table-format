name: Publish (crates.io)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing canonical release tag to publish
        required: true
        type: string
  push:
    tags:
      - "timeseries-table-format-v*"

permissions:
  contents: read

jobs:
  publish:
    name: publish (crates.io)
    if: ${{ github.repository_owner == 'mag1cfrog' }}
    runs-on: ubuntu-latest
    concurrency:
      group: crates-io-publish
      queue: max
    timeout-minutes: 30
    environment: crates-io-release
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: 1
      RUSTFLAGS: "-C debuginfo=0"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: core-ci
          cache-targets: false
          save-if: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Verify canonical tag and workspace version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python scripts/check_release_version.py --tag "${RELEASE_TAG}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify crate archives
        run: cargo package --locked -p timeseries-table-format -p timeseries-table-cli

      - name: Mint crates.io token (OIDC)
        id: cratesio
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish crates (skip already-published versions)
        shell: bash
        env:
          CARGO_NET_RETRY: "10"
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio.outputs.token }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          ua="mag1cfrog/timeseries-table-format publish-crates (GitHub Actions)"

          has_version() {
            local crate="$1"
            local ver="$2"
            curl -A "${ua}" -fsS "https://crates.io/api/v1/crates/${crate}/${ver}" >/dev/null 2>&1
          }

          retry() {
            local attempts="$1"
            local delay_s="$2"
            shift 2

            local i
            for ((i=1; i<=attempts; i++)); do
              if "$@"; then
                return 0
              fi
              if (( i == attempts )); then
                return 1
              fi
              echo "Retrying ($i/${attempts}) after ${delay_s}s: $*"
              sleep "${delay_s}"
              delay_s="$((delay_s * 2))"
              if (( delay_s > 60 )); then
                delay_s=60
              fi
            done
          }

          wait_for_registry() {
            local crate="$1"
            local ver="$2"

            local tmp
            tmp="$(mktemp -d)"
            mkdir -p "${tmp}/src"
            {
              printf '%s\n' \
                '[package]' \
                'name = "registry-probe"' \
                'version = "0.0.0"' \
                'edition = "2021"' \
                '' \
                '[dependencies]' \
                "${crate} = { version = \"=${ver}\", default-features = false }"
            } >"${tmp}/Cargo.toml"
            echo "fn main() {}" >"${tmp}/src/main.rs"

            retry 10 5 bash -lc "cd '${tmp}' && CARGO_HOME='${tmp}/cargo-home' cargo fetch -q"
          }

          publish_if_missing() {
            local crate="$1"
            local ver="$2"
            if has_version "${crate}" "${ver}"; then
              echo "Skipping ${crate} v${ver} (already on crates.io)"
              return 0
            fi
            echo "Publishing ${crate} v${ver}"
            if ! retry 5 15 cargo publish --locked -p "${crate}"; then
              if has_version "${crate}" "${ver}"; then
                echo "cargo publish failed but ${crate} v${ver} exists on crates.io; continuing"
              else
                return 1
              fi
            fi
          }

          publish_if_missing "timeseries-table-format" "${RELEASE_VERSION}"
          wait_for_registry "timeseries-table-format" "${RELEASE_VERSION}"
          publish_if_missing "timeseries-table-cli" "${RELEASE_VERSION}"
