name: Python snapshot

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/timeseries-table-python/Cargo.toml"
      - "crates/timeseries-table-python/pyproject.toml"
      - "crates/timeseries-table-python/build.rs"
      - "crates/timeseries-table-python/src/**"
      - "crates/timeseries-table-python/python/**"
      - "crates/timeseries-table-format/**"
      - "scripts/check_release_version.py"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  build:
    uses: ./.github/workflows/python-dist.yml
    permissions:
      actions: read
      contents: read
    with:
      os-json: '["ubuntu-latest","windows-2022"]'
      include-sdist: false
      run-pytest: false
      artifact-prefix: timeseries-table-format-snapshot-wheel
      artifact-retention-days: 7
      dev-prerelease: true

  verify:
    name: verify snapshot (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [build]
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download snapshot wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: timeseries-table-format-snapshot-wheel-${{ matrix.os }}
          path: dist

      - name: Install snapshot wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pyarrow>=23.0.0"
          python -m pip install \
            --no-cache-dir \
            --no-deps \
            --only-binary=:all: \
            dist/*.whl

      - name: Smoke test snapshot wheel
        shell: bash
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.metadata
          import os
          import sys

          import pyarrow
          import timeseries_table_format as ttf

          expected_python = tuple(map(int, os.environ["EXPECTED_PYTHON"].split(".")))
          if sys.version_info[:2] != expected_python:
              raise SystemExit(f"expected Python {expected_python}, found {sys.version}")
          installed = importlib.metadata.version("timeseries-table-format")
          if installed != os.environ["EXPECTED_VERSION"]:
              raise SystemExit(f"expected version {os.environ['EXPECTED_VERSION']}, found {installed}")
          if ttf.__version__.replace("-dev.", ".dev") != installed:
              raise SystemExit(f"package version {ttf.__version__} != metadata {installed}")
          if not ttf._native.__file__.endswith((".abi3.so", ".pyd")):
              raise SystemExit(f"unexpected native extension: {ttf._native.__file__}")
          result = ttf.Session().sql("select 1 as value")
          if not isinstance(result, pyarrow.Table) or result.to_pydict() != {"value": [1]}:
              raise SystemExit(f"unexpected SQL result: {result}")
          PY
