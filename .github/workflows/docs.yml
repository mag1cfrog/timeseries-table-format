name: Docs (Zensical)

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "crates/timeseries-table-python/**"
      - ".github/workflows/docs.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "docs-site/**"
      - "crates/timeseries-table-python/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docs-site/requirements.txt

      - name: Install docs dependencies
        run: python -m pip install -r docs-site/requirements.txt

      - name: Build docs
        run: python -m zensical build --strict -f docs-site/mkdocs.yml

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs-site/site

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
