name: Publish (PyPI)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI after building and validating artifacts.
        required: true
        type: boolean
        default: false
      version:
        description: Expected package version, such as 0.1.4 or v0.1.4.
        required: false
        type: string
  push:
    tags:
      - "timeseries-table-python-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  validate:
    name: validate release request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify requested version matches Cargo version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          requested="${GITHUB_REF_NAME}"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            requested="${REQUESTED_VERSION}"
            if [[ "${PUBLISH}" != "true" && -z "${requested}" ]]; then
              exit 0
            fi
            if [[ -z "${requested}" ]]; then
              echo "An expected version is required when publishing."
              exit 1
            fi
          elif [[ "${requested}" != timeseries-table-python-v* ]]; then
            echo "Unexpected tag format: ${requested}"
            exit 1
          fi

          expected="${requested#timeseries-table-python-v}"
          expected="${expected#v}"
          actual="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/timeseries-table-python/Cargo.toml)"
          if [[ -z "${actual}" || "${actual}" != "${expected}" ]]; then
            echo "Requested/Cargo version mismatch: requested=${expected} cargo=${actual:-<missing>}"
            exit 1
          fi

  build:
    needs: [validate]
    uses: ./.github/workflows/python-dist.yml
    permissions:
      contents: read
    with:
      include-sdist: true
      run-pytest: true
      artifact-prefix: dist

  publish:
    name: publish (PyPI)
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
