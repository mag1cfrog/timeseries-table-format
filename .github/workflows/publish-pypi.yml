name: Publish (PyPI)

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: pypi-publish
  queue: max

jobs:
  validate:
    name: validate release request
    if: ${{ startsWith(github.event.release.tag_name, 'timeseries-table-format-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Verify canonical tag and workspace version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(python scripts/check_release_version.py --tag "${RELEASE_TAG}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    needs: [validate]
    if: ${{ needs.validate.result == 'success' }}
    uses: ./.github/workflows/python-dist.yml
    permissions:
      actions: read
      contents: read
    with:
      include-sdist: true
      run-pytest: true
      artifact-prefix: dist
      expected-version: ${{ needs.validate.outputs.version }}

  publish:
    name: publish (PyPI)
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
