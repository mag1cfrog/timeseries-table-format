name: Warm CI caches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cache-warm.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/python-dist.yml"
      - ".cargo/**"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "**/build.rs"
      - "python/.python-version"
      - "python/pyproject.toml"

permissions:
  contents: read

concurrency:
  group: sccache-write
  queue: max

jobs:
  changes:
    name: Find caches to warm
    runs-on: ubuntu-latest
    outputs:
      wheels: ${{ steps.filter.outputs.wheels }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            wheels:
              - '.github/workflows/cache-warm.yml'
              - '.github/workflows/python-dist.yml'
              - '.cargo/**'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '**/build.rs'
              - 'python/.python-version'
              - 'python/pyproject.toml'

  core:
    name: Warm core Rust caches
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: "-C debuginfo=0"
      CLIPPY_CONF_DIR: ${{ github.workspace }}
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci
          cache-targets: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure PyO3
        shell: bash
        run: |
          set -euo pipefail
          echo "PYO3_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          if [[ -n "$libdir" ]]; then
            echo "LD_LIBRARY_PATH=$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Warm default test cache
        run: cargo test --locked --workspace --no-run

      - name: Warm all-features test cache
        run: cargo test --locked --workspace --all-targets --all-features --no-run

      - name: Check sccache writes
        id: sccache-writes
        continue-on-error: true
        run: >-
          sccache --show-stats --stats-format json |
          python -c 'import json, sys; errors = json.load(sys.stdin)["stats"]["cache_write_errors"]; sys.exit(f"sccache reported {errors} cache write errors") if errors else None'

      - name: Retry cache writes
        if: steps.sccache-writes.outcome == 'failure'
        run: |
          sccache --zero-stats
          cargo clean
          cargo test --locked --workspace --no-run
          cargo test --locked --workspace --all-targets --all-features --no-run

      - name: Verify retried sccache writes
        if: steps.sccache-writes.outcome == 'failure'
        run: >-
          sccache --show-stats --stats-format json |
          python -c 'import json, sys; errors = json.load(sys.stdin)["stats"]["cache_write_errors"]; sys.exit(f"sccache reported {errors} cache write errors") if errors else None'

  wheels:
    name: Warm Python wheel caches
    needs: [changes, core]
    if: ${{ needs.changes.outputs.wheels == 'true' }}
    uses: ./.github/workflows/python-dist.yml
    with:
      max-parallel: 2
      run-pytest: false
      upload-artifacts: false
      write-cache: true
