name: Warm CI caches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cache-warm.yml"
      - ".github/workflows/python-dist.yml"
      - ".cargo/**"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "**/build.rs"
      - "crates/timeseries-table-python/pyproject.toml"

permissions:
  contents: read

concurrency:
  group: sccache-write
  queue: max

jobs:
  changes:
    name: Find caches to warm
    runs-on: ubuntu-latest
    outputs:
      wheels: ${{ steps.filter.outputs.wheels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            wheels:
              - '.github/workflows/cache-warm.yml'
              - '.github/workflows/python-dist.yml'
              - '.cargo/**'
              - 'crates/**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '**/build.rs'
              - 'crates/timeseries-table-python/pyproject.toml'

  core:
    name: Warm core Rust caches
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: "-C debuginfo=0"
      CLIPPY_CONF_DIR: ${{ github.workspace }}
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      SCCACHE_LOG: sccache::server=debug,opendal=debug
      SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache.log
      RUSTC_WRAPPER: sccache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: core-ci
          cache-targets: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Configure PyO3
        shell: bash
        run: |
          set -euo pipefail
          echo "PYO3_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          if [[ -n "$libdir" ]]; then
            echo "LD_LIBRARY_PATH=$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Warm default test cache
        run: cargo test --locked --workspace --no-run

      - name: Warm all-features test cache
        run: cargo test --locked --workspace --all-targets --all-features --no-run

      - name: Check sccache writes
        id: sccache-writes
        continue-on-error: true
        run: >-
          sccache --show-stats --stats-format json |
          python -c 'import json, os, sys; count = json.load(sys.stdin)["stats"]["cache_write_errors"]; errors = [line for line in open(os.environ["SCCACHE_ERROR_LOG"], errors="replace") if "Error executing cache write:" in line][-count:] if count else []; fatal = count and (len(errors) != count or any("AlreadyExists" not in line for line in errors)); sys.exit(f"sccache reported {count} cache write errors") if fatal else print(f"Ignoring {count} cache entries that already exist") if count else None'

      - name: Retry cache writes
        if: steps.sccache-writes.outcome == 'failure'
        run: |
          sccache --zero-stats
          cargo clean
          cargo test --locked --workspace --no-run
          cargo test --locked --workspace --all-targets --all-features --no-run

      - name: Verify retried sccache writes
        if: steps.sccache-writes.outcome == 'failure'
        run: >-
          sccache --show-stats --stats-format json |
          python -c 'import json, os, sys; count = json.load(sys.stdin)["stats"]["cache_write_errors"]; errors = [line for line in open(os.environ["SCCACHE_ERROR_LOG"], errors="replace") if "Error executing cache write:" in line][-count:] if count else []; fatal = count and (len(errors) != count or any("AlreadyExists" not in line for line in errors)); sys.exit(f"sccache reported {count} cache write errors") if fatal else print(f"Ignoring {count} cache entries that already exist") if count else None'

      - name: Show sccache backend errors
        if: always()
        shell: bash
        run: |
          if [[ -f "$SCCACHE_ERROR_LOG" ]]; then
            grep -Ei 'Error executing cache write|RateLimited|AlreadyExists|status.*[45][0-9][0-9]|operation=write.*(error|failed)' "$SCCACHE_ERROR_LOG" || true
          fi

  wheels:
    name: Warm Python wheel caches
    needs: [changes, core]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.wheels == 'true' }}
    uses: ./.github/workflows/python-dist.yml
    permissions:
      actions: read
      contents: read
    with:
      max-parallel: 1
      run-pytest: false
      upload-artifacts: false
      write-cache: true
