name: TestPyPI snapshot

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/timeseries-table-python/Cargo.toml"
      - "crates/timeseries-table-python/pyproject.toml"
      - "crates/timeseries-table-python/build.rs"
      - "crates/timeseries-table-python/src/**"
      - "crates/timeseries-table-python/python/**"
      - "crates/timeseries-table-format/**"
      - "scripts/check_release_version.py"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  build:
    uses: ./.github/workflows/python-dist.yml
    permissions:
      actions: read
      contents: read
    with:
      os-json: '["ubuntu-latest","windows-latest"]'
      include-sdist: false
      run-pytest: false
      artifact-prefix: timeseries-table-format-testpypi-snapshot-wheel
      artifact-retention-days: 7
      dev-prerelease: true

  publish:
    name: publish snapshot (TestPyPI)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: testpypi-snapshot
      url: https://test.pypi.org/project/timeseries-table-format/${{ needs.build.outputs.version }}/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download snapshot wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: timeseries-table-format-testpypi-snapshot-wheel-*
          path: dist
          merge-multiple: true

      - name: Publish snapshot to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

  verify:
    name: verify snapshot (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [build, publish]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the published snapshot
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install "pyarrow>=23.0.0"
          for attempt in {1..10}; do
            if python -m pip install \
              --no-cache-dir \
              --no-deps \
              --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ \
              "timeseries-table-format==${VERSION}"
            then
              break
            fi
            if [[ ${attempt} -eq 10 ]]; then
              echo "TestPyPI did not serve version ${VERSION}" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Smoke test the published snapshot
        shell: bash
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.metadata
          import os
          import sys

          import pyarrow
          import timeseries_table_format as ttf

          expected_python = tuple(map(int, os.environ["EXPECTED_PYTHON"].split(".")))
          if sys.version_info[:2] != expected_python:
              raise SystemExit(f"expected Python {expected_python}, found {sys.version}")
          installed = importlib.metadata.version("timeseries-table-format")
          if installed != os.environ["EXPECTED_VERSION"]:
              raise SystemExit(f"expected version {os.environ['EXPECTED_VERSION']}, found {installed}")
          if ttf.__version__.replace("-dev.", ".dev") != installed:
              raise SystemExit(f"package version {ttf.__version__} != metadata {installed}")
          if not ttf._native.__file__.endswith((".abi3.so", ".pyd")):
              raise SystemExit(f"unexpected native extension: {ttf._native.__file__}")
          result = ttf.Session().sql("select 1 as value")
          if not isinstance(result, pyarrow.Table) or result.to_pydict() != {"value": [1]}:
              raise SystemExit(f"unexpected SQL result: {result}")
          PY
