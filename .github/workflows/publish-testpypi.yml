name: Publish (TestPyPI)

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Publish a unique prerelease snapshot version (recommended).
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-testpypi.yml"
      - ".github/workflows/python-dist.yml"
      - ".cargo/**"
      - "python/**"
      - "rust-toolchain.toml"
      - "scripts/update_python_wheel_stamp.py"
      - "crates/timeseries-table-python/**"
      - "crates/timeseries-table-core/**"
      - "crates/timeseries-table-datafusion/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  build:
    uses: ./.github/workflows/python-dist.yml
    permissions:
      contents: read
    with:
      include-sdist: true
      run-pytest: true
      artifact-prefix: dist
      dev-prerelease: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.snapshot) }}

  publish:
    name: publish (TestPyPI)
    runs-on: ubuntu-latest
    needs: [build]
    environment: testpypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
