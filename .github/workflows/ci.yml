name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch: {}   # manual run

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-rust-changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.code }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - '**/build.rs'
              - '.cargo/**'
              - 'clippy.toml'
              - '.github/workflows/cache-warm.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish-crates.yml'
              - '.github/workflows/release-plz.yml'
              - 'scripts/check_release_version.py'
              - 'scripts/test_check_release_version.py'
              - 'scripts/scan_range_rss_regression.py'
              - 'scripts/test_scan_range_rss_regression.py'
      - name: Check for skip label
        id: skip
        env:
          SKIP_HEAVY: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:skip-heavy') }}
        shell: bash
        run: |
          set -euo pipefail
          echo "skip=${SKIP_HEAVY}" >> "$GITHUB_OUTPUT"

  detect-python-changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.code }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - 'crates/timeseries-table-python/**'
              - 'crates/timeseries-table-format/**'
              - '!crates/timeseries-table-format/src/bin/tstable/**'
              - '!crates/timeseries-table-format/tests/cli_create_append_query.rs'
              - '!crates/timeseries-table-format/tests/cli_workflows.rs'
              - '!crates/timeseries-table-format/tests/shell_interactive.rs'
              - '!crates/timeseries-table-format/tests/common/**'
              - '!crates/timeseries-table-format/examples/append_profile.rs'
              - '!crates/timeseries-table-format/examples/segment_meta_bench.rs'
              - '!crates/timeseries-table-format/CLI.md'
              - '!crates/timeseries-table-format/CHANGELOG.cli.md'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/cache-warm.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish-pypi.yml'
              - '.github/workflows/publish-testpypi.yml'
              - '.github/workflows/publish-testpypi-snapshot.yml'
              - '.github/workflows/python-dist.yml'
      - name: Check for skip labels
        id: skip
        env:
          SKIP_PYTHON: ${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci:skip-python') || contains(github.event.pull_request.labels.*.name, 'ci:skip-heavy')) }}
        shell: bash
        run: |
          set -euo pipefail
          echo "skip=${SKIP_PYTHON}" >> "$GITHUB_OUTPUT"

  rust-quality-gate:
    name: rust-quality-gate / ${{ matrix.task }}
    runs-on: ubuntu-latest
    needs: [detect-rust-changes]
    if: ${{ needs['detect-rust-changes'].outputs.code == 'true' && needs['detect-rust-changes'].outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        task:
          - RSS regression checks
          - feature isolation
          - lints and docs
          - default tests
          - all-feature tests
    defaults:
      run:
        working-directory: .
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: "-C debuginfo=0"
      CLIPPY_CONF_DIR: ${{ github.workspace }}
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      RUSTC_WRAPPER: sccache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
          cache: false
          rustflags: ""

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: core-ci
          cache-targets: false
          save-if: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Setup uv
        if: matrix.task == 'RSS regression checks'
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.0"

      - name: Configure PyO3
        shell: bash
        run: |
          set -euo pipefail
          echo "PYO3_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          if [[ -n "$libdir" ]]; then
            echo "LD_LIBRARY_PATH=$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi

      - run: rustc -Vv && cargo -V && cargo clippy -V

      - name: release version guard
        if: matrix.task == 'lints and docs'
        run: |
          python scripts/test_check_release_version.py
          python scripts/check_release_version.py

      - name: process RSS regression checks
        if: matrix.task == 'RSS regression checks'
        run: |
          uv sync --project crates/timeseries-table-python --locked --no-install-project
          crates/timeseries-table-python/.venv/bin/ruff check scripts/scan_range_rss_regression.py scripts/test_scan_range_rss_regression.py
          crates/timeseries-table-python/.venv/bin/ruff format --check scripts/scan_range_rss_regression.py scripts/test_scan_range_rss_regression.py
          (
            cd crates/timeseries-table-python
            PYTHONPATH=../../scripts .venv/bin/ty check \
              ../../scripts/scan_range_rss_regression.py \
              ../../scripts/test_scan_range_rss_regression.py
          )
          crates/timeseries-table-python/.venv/bin/python scripts/test_scan_range_rss_regression.py

      - name: fmt
        if: matrix.task == 'lints and docs'
        run: cargo fmt --all -- --check

      - name: feature isolation
        if: matrix.task == 'feature isolation'
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p timeseries-table-format --no-default-features
          engine_tree="$(cargo tree --locked -p timeseries-table-format --no-default-features --edges normal,build --prefix none)"
          for dependency in datafusion clap rustyline tabled terminal_size; do
            if grep -Eq "^${dependency}([ _-]|$)" <<< "${engine_tree}"; then
              echo "Engine-only dependency tree contains forbidden dependency: ${dependency}" >&2
              exit 1
            fi
          done
          cargo check --locked -p timeseries-table-format --no-default-features --features cli --bin tstable

      - name: clippy
        if: matrix.task == 'lints and docs'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: test default features
        if: matrix.task == 'default tests'
        run: cargo test --locked --workspace --no-fail-fast

      - name: test all features and targets
        if: matrix.task == 'all-feature tests'
        run: cargo test --locked --workspace --all-targets --all-features --no-fail-fast

      - name: docs
        if: matrix.task == 'lints and docs'
        run: cargo doc --locked --workspace --no-deps

  rust-msrv:
    runs-on: ubuntu-latest
    needs: [detect-rust-changes]
    if: ${{ needs['detect-rust-changes'].outputs.code == 'true' && needs['detect-rust-changes'].outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.94.0"
          cache: false
          rustflags: ""

      - run: rustc +1.94.0 -Vv && cargo +1.94.0 -V

      - name: Check MSRV
        run: cargo +1.94.0 check --locked --workspace --all-targets --all-features

  python-quality-gate:
    runs-on: ubuntu-latest
    needs: [detect-python-changes]
    if: ${{ needs['detect-python-changes'].outputs.code == 'true' && needs['detect-python-changes'].outputs.skip != 'true' }}
    defaults:
      run:
        working-directory: crates/timeseries-table-python
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      RUSTC_WRAPPER: sccache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.0"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""

      - name: Configure PyO3 env
        shell: bash
        run: |
          set -euo pipefail
          echo "PYO3_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          if [[ -n "${libdir}" ]]; then
            echo "LD_LIBRARY_PATH=${libdir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"
          fi

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: core-ci
          cache-targets: false
          save-if: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Create venv + install deps (no extension build)
        run: |
          uv venv -p 3.12 .venv
          source .venv/bin/activate
          uv sync --locked --group dev --no-install-project --active

      - name: ruff
        run: .venv/bin/ruff check python tests

      - name: ty
        run: .venv/bin/ty check python tests

      - name: pytest (editable, test-utils)
        run: |
          source .venv/bin/activate
          .venv/bin/python -m maturin develop --locked --features test-utils
          .venv/bin/python -m pytest -q

  python-distribution:
    needs: [detect-python-changes]
    if: ${{ needs['detect-python-changes'].outputs.code == 'true' && needs['detect-python-changes'].outputs.skip != 'true' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/python-dist.yml
    with:
      include-sdist: true
      run-pytest: true
      upload-artifacts: false
      artifact-prefix: ci-dist

  ci-summary:
    # The only job to mark as "required" in branch protection.
    runs-on: ubuntu-latest
    needs: [detect-rust-changes, rust-quality-gate, rust-msrv, detect-python-changes, python-quality-gate, python-distribution]
    if: ${{ always() }}
    steps:
      - name: Summarize outcome
        run: |
          if [ "${{ needs['detect-rust-changes'].result }}" != "success" ]; then
            echo "Rust change detection failed: ${{ needs['detect-rust-changes'].result }}"
            exit 1
          fi
          if [ "${{ needs['detect-python-changes'].result }}" != "success" ]; then
            echo "Python change detection failed: ${{ needs['detect-python-changes'].result }}"
            exit 1
          fi

          if [ "${{ needs['detect-rust-changes'].outputs.code }}" = "true" ] && [ "${{ needs['detect-rust-changes'].outputs.skip }}" != "true" ]; then
            echo "Code changed; heavy job result: ${{ needs['rust-quality-gate'].result }}"
            [ "${{ needs['rust-quality-gate'].result }}" = "success" ] || exit 1
            echo "Code changed; MSRV result: ${{ needs['rust-msrv'].result }}"
            [ "${{ needs['rust-msrv'].result }}" = "success" ] || exit 1
          else
            echo "No Rust changes or heavy CI skipped."
          fi

          if [ "${{ needs['detect-python-changes'].outputs.code }}" = "true" ] && [ "${{ needs['detect-python-changes'].outputs.skip }}" != "true" ]; then
            echo "Python/binding changed; python gate result: ${{ needs['python-quality-gate'].result }}"
            [ "${{ needs['python-quality-gate'].result }}" = "success" ] || exit 1
            echo "Python/binding changed; distribution result: ${{ needs['python-distribution'].result }}"
            [ "${{ needs['python-distribution'].result }}" = "success" ] || exit 1
          else
            echo "No Python/binding changes or Python CI skipped."
          fi
