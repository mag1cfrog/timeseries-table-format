[workspace]
members = ["crates/timeseries-table-format", "crates/timeseries-table-python"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mag1cfrog/timeseries-table-format"
rust-version = "1.91.1"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
timeseries-table-format = { path = "crates/timeseries-table-format", version = "0.3.0", default-features = false }

arrow = "57.1.0"
arrow-array = "57.1.0"
arrow-ipc = "57.1.0"
arrow-select = "57.1.0"
arrow-csv = "57.1.0"
arrow-json = "57.1.0"
parquet = "57.1.0"

chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"

datafusion = "51.0.0"

futures = "0.3.31"
futures-util = "0.3.31"

tokio = { version = "1.48.0" }

async-trait = "0.1.89"

snafu = { version = "0.9.2" }
tabled = { version = "0.21.0", default-features = false, features = ["std"] }
