[package]
name = "timeseries-table-format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
autobins = false
description = "Append-only time-series table format with gap/overlap tracking"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["time-series", "parquet", "datafusion", "analytics"]
categories = ["database", "data-structures"]

[features]
default = ["datafusion"]
datafusion = [
    "dep:async-trait",
    "dep:chrono-tz",
    "dep:datafusion",
    "dep:object_store",
    "tokio/sync",
]
cli = [
    "datafusion",
    "arrow/prettyprint",
    "dep:arrow-csv",
    "dep:arrow-json",
    "dep:clap",
    "dep:futures-util",
    "dep:rustyline",
    "dep:tabled",
    "dep:terminal_size",
    "tokio/macros",
    "tokio/process",
    "tokio/rt-multi-thread",
]
test-counters = []

[dependencies]
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-csv = { workspace = true, optional = true }
arrow-json = { workspace = true, optional = true }
arrow-select = { workspace = true }
async-trait = { workspace = true, optional = true }
blake3 = "1.8.2"
bytes = "1.11.0"
chrono = { workspace = true }
chrono-tz = { workspace = true, optional = true }
clap = { version = "4.5.54", features = ["derive"], optional = true }
datafusion = { workspace = true, optional = true }
futures = { workspace = true }
futures-util = { workspace = true, optional = true }
log = "0.4"
object_store = { version = "0.12.5", optional = true }
parquet = { workspace = true, features = ["async"] }
rayon = "1.11.0"
roaring = "0.11.2"
rustyline = { version = "17.0.2", features = ["with-file-history"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
snafu = { workspace = true, features = ["backtrace"] }
tabled = { workspace = true, optional = true }
terminal_size = { version = "0.3.0", optional = true }
tokio = { version = "1.48.0", features = ["fs", "io-util", "rt"] }

[dev-dependencies]
arrow-csv = { workspace = true }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }

[[bin]]
name = "tstable"
path = "src/bin/tstable/main.rs"
required-features = ["cli"]

[[example]]
name = "append_profile"
required-features = ["cli"]

[[example]]
name = "coverage_bench"

[[example]]
name = "segment_meta_bench"
required-features = ["cli"]

[[example]]
name = "query_nvda_ma"
required-features = ["datafusion"]

[[test]]
name = "ts_table_provider_tests"
required-features = ["datafusion"]

[[test]]
name = "cli_create_append_query"
required-features = ["cli"]

[[test]]
name = "cli_workflows"
required-features = ["cli"]

[[test]]
name = "shell_interactive"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
