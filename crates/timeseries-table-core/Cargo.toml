[package]
name = "timeseries-table-core"
version = "0.2.2"
edition = "2024"
rust-version.workspace = true
license = "MIT"
repository = "https://github.com/mag1cfrog/timeseries-table-format"
description = "Core engine for a Rust-native log-structured time-series table format (metadata log + coverage bitmaps)."
readme = "README.md"

[dependencies]
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-select = { workspace = true }
async-trait = { workspace = true, optional = true }
blake3 = "1.8.2"
bytes = "1.11.0"
chrono = { workspace = true }
chrono-tz = { workspace = true, optional = true }
datafusion = { workspace = true, optional = true }
futures = { workspace = true }
log = "0.4"
object_store = { version = "0.12.5", optional = true }
parquet = { workspace = true }
rayon = "1.11.0"
roaring = "0.11.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
snafu = { workspace = true, features = ["backtrace"] }
tokio = { version = "1.48.0", features = ["fs", "io-util"] }

[features]
default = []
datafusion = [
    "dep:async-trait",
    "dep:chrono-tz",
    "dep:datafusion",
    "dep:object_store",
    "tokio/sync",
]
test-counters = []

[dev-dependencies]
arrow-csv = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }

[[example]]
name = "query_nvda_ma"
required-features = ["datafusion"]

[[test]]
name = "ts_table_provider_tests"
required-features = ["datafusion"]

[lints]
workspace = true
