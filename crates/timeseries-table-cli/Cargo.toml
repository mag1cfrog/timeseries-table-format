[package]
name = "timeseries-table-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "tstable"
license.workspace = true
repository.workspace = true
description = "Command-line tool for creating, managing, and querying time-series tables (powered by DataFusion)."
readme = "README.md"

[[bin]]
name = "tstable"
path = "src/main.rs"

[dependencies]
arrow = { workspace = true, features = ["prettyprint"] }
arrow-array = { workspace = true }
arrow-csv = { workspace = true }
arrow-json = { workspace = true }
bytes = "1.11.0"
clap = { version = "4.5.54", features = ["derive"] }
datafusion = { workspace = true }
parquet = { workspace = true }
rayon = "1.11.0"
snafu = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros", "process"] }

timeseries-table-format = { workspace = true, features = ["datafusion"] }
futures-util = { workspace = true }
async-trait = { workspace = true }
tabled = { workspace = true }
rustyline = { version = "17.0.2", features = ["with-file-history"] }
terminal_size = "0.3.0"
chrono = { workspace = true }

[dev-dependencies]
arrow = { workspace = true }
parquet = { workspace = true }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
timeseries-table-format = { workspace = true, features = ["test-counters"] }

[lints]
workspace = true
